<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS ORB</title>
<style>
  :root{
    --amber:#ffb020;
    --hot:#fff0c4;
    --deep:#ff6a00;
    --ink:#05070c;
    --haze:#0c1220;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--ink);overflow:hidden}
  body{
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    color:rgba(255,206,130,.75);
  }
  #stage{position:fixed;inset:0}
  canvas{display:block}

  /* 背景の空気感：球体の光が室内に散っている感じ */
  #haze{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 50% at 50% 48%, rgba(255,140,20,.10), transparent 70%),
      radial-gradient(120% 90% at 50% 120%, rgba(20,60,120,.22), transparent 60%);
    mix-blend-mode:screen;
  }
  #vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(75% 65% at 50% 50%, transparent 40%, rgba(0,0,0,.72) 100%);
  }

  /* HUD */
  #hud{
    position:fixed;left:0;right:0;bottom:0;
    padding:20px clamp(16px,4vw,44px) 24px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  }
  #state{display:flex;align-items:center;gap:10px;white-space:nowrap}
  #dot{width:6px;height:6px;border-radius:50%;background:var(--amber);
       box-shadow:0 0 10px var(--amber);transition:background .3s,box-shadow .3s}
  #meter{flex:1;max-width:340px;height:1px;background:rgba(255,176,32,.16);position:relative}
  #meter i{position:absolute;inset:0 auto 0 0;width:0%;background:var(--hot);
           box-shadow:0 0 8px var(--amber)}
  #controls{display:flex;gap:8px}
  button{
    font:inherit;letter-spacing:.18em;text-transform:uppercase;
    background:transparent;color:rgba(255,206,130,.8);
    border:1px solid rgba(255,176,32,.28);padding:9px 16px;
    cursor:pointer;transition:.2s;
  }
  button:hover{border-color:rgba(255,176,32,.7);color:var(--hot);
               background:rgba(255,140,20,.06)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button[aria-pressed="true"]{border-color:var(--amber);color:var(--hot);
                              background:rgba(255,140,20,.12)}
  #note{position:fixed;top:22px;left:0;right:0;text-align:center;
        font-size:10px;letter-spacing:.3em;opacity:.35}
  @media(max-width:620px){
    #hud{flex-direction:column;align-items:stretch}
    #meter{max-width:none}
    #controls{justify-content:center}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="haze"></div>
<div id="vignette"></div>

<div id="note">J.A.R.V.I.S. — CORE INTERFACE</div>

<div id="hud">
  <div id="state"><span id="dot"></span><span id="label">待機中</span></div>
  <div id="meter"><i id="fill"></i></div>
  <div id="controls">
    <button id="micBtn" aria-pressed="false">マイク</button>
    <button id="demoBtn">発話テスト</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══════════════════════════════════════════
   1. シーン
   ══════════════════════════════════════════ */
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 3.35);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('stage').appendChild(renderer.domElement);

const group = new THREE.Group();
group.rotation.z = 0.18;
scene.add(group);

/* ══════════════════════════════════════════
   2. 球殻フィラメントの生成
   ── 接平面上を「8方向に量子化して」歩かせると
      回路基板／都市の街区みたいな線になる
   ══════════════════════════════════════════ */
const R = 1.0;
const GOLDEN = Math.PI * (3 - Math.sqrt(5));

function fibPoint(i, n){
  const y  = 1 - (i / (n - 1)) * 2;
  const rr = Math.sqrt(Math.max(0, 1 - y*y));
  const th = i * GOLDEN;
  return new THREE.Vector3(Math.cos(th)*rr, y, Math.sin(th)*rr);
}

function buildFilaments(count){
  const pos = [], dir = [], rnd = [], seed = [], nodes = [];
  const up = new THREE.Vector3();
  const t1 = new THREE.Vector3(), t2 = new THREE.Vector3();
  const cur = new THREE.Vector3(), nxt = new THREE.Vector3();

  for(let i=0; i<count; i++){
    const base = fibPoint(i, count);

    // 接平面の直交基底
    up.set(0,1,0);
    if(Math.abs(base.dot(up)) > 0.95) up.set(1,0,0);
    t1.crossVectors(base, up).normalize();
    t2.crossVectors(base, t1).normalize();

    const shell = R * (0.93 + Math.random()*0.13);
    const s     = Math.random();
    const bright= 0.25 + Math.random()*0.75;

    cur.copy(base).multiplyScalar(shell);

    if(Math.random() < 0.13){
      // 放射状のトゲ（外周に飛び出す線）
      const len = 0.04 + Math.random()*0.24;
      nxt.copy(base).multiplyScalar(shell + len);
      pushSeg(cur, nxt, base, bright, s);
      nodes.push(nxt.x, nxt.y, nxt.z, base.x, base.y, base.z, bright, s);
      continue;
    }

    // 接平面を折れ線で歩く
    const steps = 2 + (Math.random()*4|0);
    let ang = (Math.random()*8|0) * Math.PI/4;
    for(let k=0; k<steps; k++){
      ang += ((Math.random()*3|0) - 1) * Math.PI/4;      // -45° / 0 / +45°
      const len = 0.018 + Math.random()*0.075;
      nxt.copy(cur)
         .addScaledVector(t1, Math.cos(ang)*len)
         .addScaledVector(t2, Math.sin(ang)*len);
      // 球殻に押し戻す（たまに層を飛び移る）
      nxt.normalize().multiplyScalar(
        shell + (Math.random() < 0.18 ? (Math.random()-0.5)*0.07 : 0)
      );
      const d = nxt.clone().normalize();
      pushSeg(cur, nxt, d, bright, s);
      if(Math.random() < 0.34)
        nodes.push(nxt.x, nxt.y, nxt.z, d.x, d.y, d.z, bright, s);
      cur.copy(nxt);
    }
  }

  function pushSeg(a, b, d, bright, s){
    pos.push(a.x,a.y,a.z, b.x,b.y,b.z);
    dir.push(d.x,d.y,d.z, d.x,d.y,d.z);
    rnd.push(bright, bright);
    seed.push(s, s);
  }
  return { pos, dir, rnd, seed, nodes };
}

function buildArcs(count){
  // 表面をなぞる大きな円弧＝リファレンスの「掃くような線」
  const pos = [], dir = [], rnd = [], seed = [];
  const axis = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3();
  const q = new THREE.Quaternion();
  for(let i=0;i<count;i++){
    axis.set(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
    const start = new THREE.Vector3(0,1,0).cross(axis);
    if(start.lengthSq() < 1e-4) start.set(1,0,0);
    start.normalize();
    const shell = R * (0.99 + Math.random()*0.07);
    const span  = Math.PI * (0.45 + Math.random()*1.15);
    const segs  = 200;
    const s = Math.random(), bright = 0.85 + Math.random()*0.15;
    for(let k=0;k<segs;k++){
      q.setFromAxisAngle(axis, span * (k/segs));
      a.copy(start).applyQuaternion(q).multiplyScalar(shell);
      q.setFromAxisAngle(axis, span * ((k+1)/segs));
      b.copy(start).applyQuaternion(q).multiplyScalar(shell);
      const d = a.clone().normalize();
      pos.push(a.x,a.y,a.z, b.x,b.y,b.z);
      dir.push(d.x,d.y,d.z, d.x,d.y,d.z);
      rnd.push(bright, bright);
      seed.push(s, s);
    }
  }
  return { pos, dir, rnd, seed };
}

/* ══════════════════════════════════════════
   3. シェーダ（膨らみはGPU側で頂点ごとに）
   ══════════════════════════════════════════ */
const uniforms = {
  uLevel : { value: 0 },     // 音声エンベロープ 0–1
  uTime  : { value: 0 },
  uBreath: { value: 0 },     // 待機中のゆっくりした呼吸
  uCool  : { value: 0 },     // 傾聴時にわずかに白青へ
  uWarm  : { value: new THREE.Color(0xff6a00) },
  uAmber : { value: new THREE.Color(0xffb020) },
  uHot   : { value: new THREE.Color(0xfff2cc) },
  uChill : { value: new THREE.Color(0x9fd8ff) },
  uScale : { value: 1 },
};

const VERT = /* glsl */`
  attribute vec3  aDir;
  attribute float aRand;
  attribute float aSeed;
  uniform float uLevel, uTime, uBreath, uScale;
  varying float vGlow;
  void main(){
    // 音節ごとの押し出し量。線ごとにバラつかせて風船にならないようにする
    float push  = uLevel * (0.05 + 0.30 * aRand);
    float flick = sin(uTime * 2.3 + aSeed * 43.0) * (0.006 + uLevel * 0.022);
    vec3  p = (position + aDir * (push + uBreath + flick)) * uScale;
    vGlow   = 0.30 + aRand * 0.35 + uLevel * 0.95;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  }`;

const FRAG = /* glsl */`
  uniform vec3  uWarm, uAmber, uHot, uChill;
  uniform float uCool;
  varying float vGlow;
  void main(){
    vec3 c = mix(uWarm, uAmber, clamp(vGlow, 0.0, 1.0));
    c = mix(c, uHot, clamp(vGlow - 0.85, 0.0, 1.0));
    c = mix(c, uChill, uCool * 0.45);
    gl_FragColor = vec4(c * (0.55 + vGlow * 0.75), 1.0);
  }`;

function makeMaterial(opacityBoost){
  return new THREE.ShaderMaterial({
    uniforms, vertexShader: VERT,
    fragmentShader: FRAG.replace('0.55 +', (0.55 * opacityBoost) + ' +'),
    blending: THREE.AdditiveBlending,
    depthWrite: false, transparent: true,
  });
}

function toGeometry(d){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(d.pos, 3));
  g.setAttribute('aDir',     new THREE.Float32BufferAttribute(d.dir, 3));
  g.setAttribute('aRand',    new THREE.Float32BufferAttribute(d.rnd, 1));
  g.setAttribute('aSeed',    new THREE.Float32BufferAttribute(d.seed,1));
  return g;
}

const fil = buildFilaments(3200);
group.add(new THREE.LineSegments(toGeometry(fil), makeMaterial(1.0)));
group.add(new THREE.LineSegments(toGeometry(buildArcs(11)), makeMaterial(1.35)));

// 交点の光点
const ng = new THREE.BufferGeometry();
const np = [], nd = [], nr = [], ns = [];
for(let i=0; i<fil.nodes.length; i+=8){
  np.push(fil.nodes[i], fil.nodes[i+1], fil.nodes[i+2]);
  nd.push(fil.nodes[i+3], fil.nodes[i+4], fil.nodes[i+5]);
  nr.push(fil.nodes[i+6]); ns.push(fil.nodes[i+7]);
}
ng.setAttribute('position', new THREE.Float32BufferAttribute(np,3));
ng.setAttribute('aDir',     new THREE.Float32BufferAttribute(nd,3));
ng.setAttribute('aRand',    new THREE.Float32BufferAttribute(nr,1));
ng.setAttribute('aSeed',    new THREE.Float32BufferAttribute(ns,1));
const nodeMat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: VERT.replace('gl_Position =',
    'gl_PointSize = 1.6 + uLevel * 2.4;\n    gl_Position ='),
  fragmentShader: FRAG,
  blending: THREE.AdditiveBlending, depthWrite:false, transparent:true,
});
group.add(new THREE.Points(ng, nodeMat));

// 中心の熱源
const coreCanvas = document.createElement('canvas');
coreCanvas.width = coreCanvas.height = 128;
{
  const c = coreCanvas.getContext('2d');
  const g = c.createRadialGradient(64,64,0, 64,64,64);
  g.addColorStop(0,   'rgba(255,244,214,1)');
  g.addColorStop(0.25,'rgba(255,176,32,.55)');
  g.addColorStop(1,   'rgba(255,110,0,0)');
  c.fillStyle = g; c.fillRect(0,0,128,128);
}
const core = new THREE.Sprite(new THREE.SpriteMaterial({
  map: new THREE.CanvasTexture(coreCanvas),
  blending: THREE.AdditiveBlending, depthWrite:false, transparent:true,
}));
core.scale.setScalar(1.5);
group.add(core);

/* ══════════════════════════════════════════
   4. ポストプロセス
   ══════════════════════════════════════════ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 1.05, 0.75, 0.02);
composer.addPass(bloom);

/* ══════════════════════════════════════════
   5. 音声 → エンベロープ
   ここが「しゃべってる感」の全部。
   立ち上がり速く(0.4) / 戻り遅く(0.07) にすると
   音節ごとに膨らんで戻る動きになる
   ══════════════════════════════════════════ */
let audioCtx = null, analyser = null, buf = null;
let level = 0, state = 'idle', demoUntil = 0, micStream = null;

const ATTACK = 0.40, RELEASE = 0.07, GAIN = 3.2, FLOOR = 0.015;

function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.25;
    buf = new Uint8Array(analyser.fftSize);
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function rawLevel(t){
  if(performance.now() < demoUntil){
    // 発話テスト：音節っぽい包絡を合成
    const e = (Math.sin(t*13.5)*0.5+0.5) * (0.45+0.55*Math.abs(Math.sin(t*2.1)));
    return Math.sin(t*3.3) > -0.55 ? e : 0.02;
  }
  if(!analyser) return 0;
  analyser.getByteTimeDomainData(buf);
  let sum = 0;
  for(let i=0;i<buf.length;i++){ const v = (buf[i]-128)/128; sum += v*v; }
  const rms = Math.sqrt(sum/buf.length);
  return Math.min(1, Math.max(0, rms - FLOOR) * GAIN);
}

/* ══════════════════════════════════════════
   6. 状態
   ══════════════════════════════════════════ */
const dot = document.getElementById('dot');
const label = document.getElementById('label');
const fill = document.getElementById('fill');
const LABELS = { idle:'待機中', listening:'傾聴中', speaking:'応答中' };
const COLORS = { idle:'#ff8c1a', listening:'#9fd8ff', speaking:'#fff2cc' };

function setState(s){
  state = s;
  label.textContent = LABELS[s] || s;
  dot.style.background = COLORS[s];
  dot.style.boxShadow  = `0 0 12px ${COLORS[s]}`;
}

/* ══════════════════════════════════════════
   7. 外部API（Python側から叩く用）
   ══════════════════════════════════════════ */
window.JARVIS = {
  setState,

  // VOICEVOXのWAVをここに流すと、その波形で球体が膨らむ
  async speak(src){
    ensureAudio();
    const url = src instanceof Blob ? URL.createObjectURL(src) : src;
    const el  = new Audio(url);
    el.crossOrigin = 'anonymous';
    const node = audioCtx.createMediaElementSource(el);
    node.connect(analyser);
    node.connect(audioCtx.destination);
    setState('speaking');
    await el.play();
    return new Promise(res => {
      el.onended = () => { setState('idle'); node.disconnect(); res(); };
    });
  },

  // Python側のWebSocketに繋ぐ（{type:"state"} / 生のWAVバイナリ）
  connect(url = 'ws://127.0.0.1:8765'){
    const ws = new WebSocket(url);
    ws.binaryType = 'blob';
    ws.onmessage = ev => {
      if(ev.data instanceof Blob) window.JARVIS.speak(ev.data);
      else { try{ setState(JSON.parse(ev.data).state); }catch(e){} }
    };
    ws.onerror = () => {};
    return ws;
  },
};

/* ══════════════════════════════════════════
   8. UI
   ══════════════════════════════════════════ */
const micBtn = document.getElementById('micBtn');
micBtn.onclick = async () => {
  if(micStream){
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
    micBtn.setAttribute('aria-pressed','false');
    setState('idle');
    return;
  }
  try{
    ensureAudio();
    micStream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:true, noiseSuppression:true }
    });
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    micBtn.setAttribute('aria-pressed','true');
    setState('listening');
  }catch(e){
    label.textContent = 'マイクを使用できません';
  }
};

document.getElementById('demoBtn').onclick = () => {
  demoUntil = performance.now() + 4000;
  setState('speaking');
  setTimeout(() => setState(micStream ? 'listening' : 'idle'), 4000);
};

/* ══════════════════════════════════════════
   9. ループ
   ══════════════════════════════════════════ */
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const t  = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.05);

  const target = rawLevel(t);
  level += (target - level) * (target > level ? ATTACK : RELEASE);

  uniforms.uTime.value   = t;
  uniforms.uLevel.value  = level;
  uniforms.uBreath.value = (REDUCED ? 0.004 : 0.012) * Math.sin(t * 0.55);
  uniforms.uCool.value  += ((state === 'listening' ? 1 : 0) - uniforms.uCool.value) * 0.05;

  // 傾聴中はわずかに締まり、応答中は膨らむ
  const wanted = state === 'listening' ? 0.965 : 1 + level * 0.075;
  uniforms.uScale.value += (wanted - uniforms.uScale.value) * 0.12;

  const spin = REDUCED ? 0.02 : 0.075;
  group.rotation.y += dt * (spin + level * 0.14);
  group.rotation.x  = Math.sin(t * 0.21) * 0.11;

  core.scale.setScalar(1.5 + level * 1.5);
  core.material.opacity = 0.55 + level * 0.45;
  bloom.strength = 0.85 + level * 1.25;

  fill.style.width = (level * 100).toFixed(1) + '%';
  composer.render();
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(innerWidth, innerHeight);
});
</script>
</body>
</html>
